const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(u,p){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(u+":"+p),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}
function expired(d){return new Date()>new Date(d+"T23:59:59Z")}
async function go(u,p){
  const msg=document.getElementById("msg");
  if(expired(EXPIRES)){msg.textContent="This code has run out. Ask for a new card.";return}
  msg.textContent="Opening…";
  try{const data=await unlock(u.trim(),p.trim());
    if(expired(data.expires)){msg.textContent="This code has run out. Ask for a new card.";return}
    document.getElementById("app").innerHTML=data.html.replace(/<table>/g,'<div class="wrap"><table>').replace(/<\/table>/g,'</table></div>')+'<p class="foot">Open until '+data.expires+'.</p>';
    document.title="The Book of Small Magicks";
  }catch(e){msg.textContent="That name and password don't open it."}
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("u").value,document.getElementById("p").value)});
const h=new URLSearchParams(location.hash.slice(1));
if(h.get("u")&&h.get("p")){const u=h.get("u"),p=h.get("p");history.replaceState(null,"",location.pathname);go(u,p)}
